<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;">
  <!-- Status Bar -->
  <rect width="390" height="44" fill="#0F766E"/>
  <text x="32" y="28" fill="#FFFFFF" font-size="14" font-weight="600">9:42</text>
  <text x="340" y="28" fill="#FFFFFF" font-size="12">5G 92%</text>

  <!-- App Header with Back & Step -->
  <rect y="44" width="390" height="60" fill="#0F766E"/>
  <text x="20" y="80" fill="#FFFFFF" font-size="20">←</text>
  <text x="50" y="80" fill="#FFFFFF" font-size="18" font-weight="bold">Step 2: Check Extracted Numbers</text>
  <text x="50" y="96" fill="#CCFBF1" font-size="12">कदम २: निकाले गए नंबरों की जांच करें</text>

  <!-- PII Removed Reassurance Banner -->
  <rect x="20" y="118" width="350" height="44" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="32" y="145" fill="#065F46" font-size="13" font-weight="600">✓ Patient Name &amp; Phone Number Removed (Anonymized)</text>

  <!-- Title & Instruction -->
  <text x="20" y="185" fill="#0F172A" font-size="18" font-weight="bold">Review 3 Detected Tests</text>
  <text x="20" y="206" fill="#64748B" font-size="13">Check values against your paper copy. Tap ✏️ to edit if needed.</text>

  <!-- Card 1: Fasting Blood Sugar (Above Range - Warm Amber) -->
  <rect x="20" y="225" width="350" height="110" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="36" y="255" fill="#0F172A" font-size="17" font-weight="bold">Fasting Blood Sugar</text>
  <text x="36" y="275" fill="#64748B" font-size="13">फास्टिंग ब्लड शुगर (खाली पेट)</text>
  
  <text x="36" y="312" fill="#B45309" font-size="24" font-weight="bold">138 <tspan font-size="14" font-weight="normal">mg/dL</tspan></text>
  
  <rect x="210" y="240" width="145" height="26" rx="6" fill="#FEF3C7"/>
  <text x="218" y="258" fill="#B45309" font-size="12" font-weight="600">▲ Above Standard Range</text>

  <text x="215" y="295" fill="#64748B" font-size="12">Normal: 70 – 99 mg/dL</text>
  <text x="330" y="312" fill="#0F766E" font-size="16">✏️</text>

  <!-- Card 2: HbA1c (Above Range - Warm Amber) -->
  <rect x="20" y="350" width="350" height="110" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="36" y="380" fill="#0F172A" font-size="17" font-weight="bold">HbA1c (3-Month Sugar)</text>
  <text x="36" y="400" fill="#64748B" font-size="13">एचबीए1सी (३ महीने का औसत)</text>
  
  <text x="36" y="437" fill="#B45309" font-size="24" font-weight="bold">6.2 <tspan font-size="14" font-weight="normal">%</tspan></text>
  
  <rect x="210" y="365" width="145" height="26" rx="6" fill="#FEF3C7"/>
  <text x="218" y="383" fill="#B45309" font-size="12" font-weight="600">▲ Above Standard Range</text>

  <text x="215" y="420" fill="#64748B" font-size="12">Normal: &lt; 5.7 %</text>
  <text x="330" y="437" fill="#0F766E" font-size="16">✏️</text>

  <!-- Card 3: Hemoglobin (Normal - Forest Green) -->
  <rect x="20" y="475" width="350" height="110" rx="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="36" y="505" fill="#0F172A" font-size="17" font-weight="bold">Hemoglobin (Hb)</text>
  <text x="36" y="525" fill="#64748B" font-size="13">हीमोग्लोबिन</text>
  
  <text x="36" y="562" fill="#15803D" font-size="24" font-weight="bold">13.5 <tspan font-size="14" font-weight="normal">g/dL</tspan></text>
  
  <rect x="225" y="490" width="130" height="26" rx="6" fill="#DCFCE7"/>
  <text x="238" y="508" fill="#15803D" font-size="12" font-weight="600">✓ Within Standard</text>

  <text x="215" y="545" fill="#64748B" font-size="12">Normal: 12.0 – 15.0 g/dL</text>
  <text x="330" y="562" fill="#0F766E" font-size="16">✏️</text>

  <!-- Add missing test button -->
  <rect x="20" y="605" width="350" height="48" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="125" y="635" fill="#0F766E" font-size="15" font-weight="600">+ Add Missing Test</text>

  <!-- Sticky Bottom Action Bar -->
  <rect y="725" width="390" height="119" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="20" y="745" width="350" height="56" rx="14" fill="#0F766E"/>
  <text x="65" y="779" fill="#FFFFFF" font-size="17" font-weight="bold">Confirm &amp; Explain in Hindi/English</text>
  <text x="110" y="794" fill="#CCFBF1" font-size="12">नंबर सही हैं, आसान भाषा में समझाइए</text>
</svg>
