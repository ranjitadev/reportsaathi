<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;">
  <!-- Status Bar -->
  <rect width="390" height="44" fill="#0F766E"/>
  <text x="32" y="28" fill="#FFFFFF" font-size="14" font-weight="600">9:41</text>
  <text x="340" y="28" fill="#FFFFFF" font-size="12">5G 92%</text>

  <!-- App Header -->
  <rect y="44" width="390" height="64" fill="#0F766E"/>
  <text x="20" y="83" fill="#FFFFFF" font-size="22" font-weight="bold">ReportSaathi</text>
  <text x="145" y="83" fill="#99F6E4" font-size="16">रिपोर्ट साथी</text>
  
  <!-- Language Toggle Pill -->
  <rect x="270" y="60" width="100" height="32" rx="16" fill="#134E4A"/>
  <rect x="272" y="62" width="46" height="28" rx="14" fill="#0F766E"/>
  <text x="286" y="81" fill="#FFFFFF" font-size="13" font-weight="bold">EN</text>
  <text x="330" y="81" fill="#CCFBF1" font-size="13">हिंदी</text>

  <!-- Content Container -->
  <!-- Hero Title -->
  <text x="20" y="145" fill="#0F172A" font-size="22" font-weight="bold">Understand Your Blood Report</text>
  <text x="20" y="172" fill="#047857" font-size="16" font-weight="600">अपनी लैब रिपोर्ट को आसान भाषा में समझें</text>
  <text x="20" y="200" fill="#475569" font-size="14" font-weight="normal">No confusing jargon. No alarming panic.</text>

  <!-- Upload Card (Dotted Box) -->
  <rect x="20" y="225" width="350" height="230" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Document Icon inside circle -->
  <circle cx="195" cy="285" r="32" fill="#F0FDFA"/>
  <path d="M185 272 H201 L209 280 V300 H185 Z" fill="#0F766E" opacity="0.9"/>
  <line x1="189" y1="284" x2="199" y2="284" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="189" y1="290" x2="205" y2="290" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="189" y1="295" x2="203" y2="295" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Upload Button (Elderly friendly 56px height) -->
  <rect x="45" y="335" width="300" height="56" rx="14" fill="#0F766E"/>
  <text x="105" y="369" fill="#FFFFFF" font-size="17" font-weight="bold">📄 Upload Lab PDF</text>

  <text x="110" y="415" fill="#047857" font-size="14" font-weight="600">या रिपोर्ट PDF चुनें (व्हाट्सएप वाली)</text>
  <text x="65" y="440" fill="#64748B" font-size="12">Supports Dr. Lal, Apollo, 1mg, SRL, Metropolis &amp; Local Labs</text>

  <!-- Sample Report Link -->
  <text x="105" y="485" fill="#0F766E" font-size="14" font-weight="600" text-decoration="underline">Don't have a report? Try a sample report</text>

  <!-- Privacy Shield Reassurance Card -->
  <rect x="20" y="520" width="350" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="48" cy="555" r="16" fill="#DCFCE7"/>
  <text x="43" y="561" fill="#15803D" font-size="16">🛡️</text>
  
  <text x="75" y="550" fill="#0F172A" font-size="16" font-weight="bold">100% Private &amp; Secure</text>
  <text x="75" y="572" fill="#15803D" font-size="13" font-weight="600">१००% सुरक्षित और गोपनीय (DPDP Act 2023)</text>
  <text x="75" y="596" fill="#475569" font-size="13">Your name, phone number &amp; records are never stored on any server. Data is removed immediately after session.</text>

  <!-- How it works 3 mini steps -->
  <rect x="20" y="670" width="350" height="90" rx="12" fill="#F1F5F9"/>
  <text x="35" y="700" fill="#334155" font-size="13" font-weight="bold">1. Upload PDF  →  2. Check Numbers  →  3. Get 3 Doctor Questions</text>
  <text x="35" y="730" fill="#047857" font-size="12">१. रिपोर्ट डालें  →  २. नंबर देखें  →  ३. डॉक्टर से पूछने के सवाल पाएं</text>

  <!-- Footer safe harbor notice -->
  <text x="35" y="795" fill="#94A3B8" font-size="11" text-anchor="middle" x="195">ReportSaathi is an educational health literacy tool, not a medical diagnosis.</text>
</svg>
